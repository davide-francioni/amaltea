spring.application.name=amaltea

# ---------------------------------------------------------------------------
# Percorsi
# ---------------------------------------------------------------------------
# Relativi alla working directory del processo (AMALTEA/amaltea).
amaltea.dataset-path=../Dataset - Test
amaltea.archive-path=./archive
amaltea.terraform-module-path=./terraform
# DA VERIFICARE: nome reale del jar dopo la build di CAPRA.
amaltea.capra-jar-path=../../CAPRA-main/target/demo-0.0.1-SNAPSHOT.jar

# ---------------------------------------------------------------------------
# Parametri metodologici
# ---------------------------------------------------------------------------
# Ripetizioni del riferimento per documento. Tre: sulle API baseline sono circa
# $13 contro $4,40 di una passata sola, e senza ripetizioni non si distingue
# l'incapacita' di un SLM dal rumore run-to-run del riferimento stesso.
amaltea.reference-repetitions=3

# Documenti falliti dopo i quali un trial viene interrotto. Parametro di
# efficienza, non di correttezza: conservativo adesso, da affinare sui primi
# risultati. Con 10 documenti, 5 significa "meta' corpus fallita, inutile
# proseguire".
amaltea.fail-fast-threshold=5

# ---------------------------------------------------------------------------
# Configurazione baseline di CAPRA
# ---------------------------------------------------------------------------
# Serve a generare gli Standard Output con la configurazione originale.
#
# ATTENZIONE: questi valori vanno presi da application.yaml e dal codice di
# CAPRA, MAI dal suo README, che diverge dalla configurazione reale su tre
# punti (fra cui la data del modello Haiku). Compilarli leggendo la
# documentazione produrrebbe in silenzio un riferimento diverso da quello con
# cui CAPRA e' stato validato nel paper.
amaltea.baseline.openai-model=gpt-5.1
amaltea.baseline.openai-base-url=https://api.openai.com
amaltea.baseline.openai-api-key=${OPENAI_API_KEY:}
amaltea.baseline.anthropic-model=claude-haiku-4-5-20251001
amaltea.baseline.anthropic-base-url=https://api.anthropic.com
amaltea.baseline.anthropic-api-key=${ANTHROPIC_API_KEY:}
amaltea.baseline.timeout-seconds=300

# ---------------------------------------------------------------------------
# Sistema sotto test
# ---------------------------------------------------------------------------
# Porta 8085: e' quella su cui CAPRA e' configurato in application.yaml.
amaltea.capra.base-url=http://localhost:8085

# Avvio: copre JVM, contesto Spring e costruzione del registro dei client.
amaltea.capra.startup-timeout-seconds=120

# Budget per l'analisi di un singolo documento. Il paper riporta poco piu' di
# quattro minuti con modelli commerciali; un SLM locale e' piu' lento, e il
# percorso deterministico raddoppia circa i tempi. 1800 s e' volutamente largo:
# un timeout e' un Hard Fail, e non deve scattare per un modello semplicemente
# lento invece che incapace.
amaltea.capra.run-timeout-seconds=1800

# Attesa per una terminazione pulita prima di forzarla.
amaltea.capra.shutdown-grace-seconds=15
